    sha256: 9796542408ed37caedd01b5dff45c76e1ccd8d9db012c5ad8df6b590ff6fd4f7
    size_bytes: 1873835
    duration_seconds: 30
    license: Free Art License (FAL; preserve attribution and license terms)
