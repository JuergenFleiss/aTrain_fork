schema_version: 1
purpose: >-
  Candidate fixture inventory for the whisper.cpp feasibility experiment.
  A pending entry is not evidence that the case has passed.
audio_policy: >-
  Do not add private evaluation audio. Do not upload arbitrary audio or model
  caches. Preserve attribution and license notices with any redistributed
  fixture. Synthetic cases are generated from the recipe here and need no
  third-party audio.
readiness: >-
  Only the two existing English MP3 files are immediately runnable, for local
  exploration. They are candidates pending source-chain/license review and
  human review where indicated. Generated fixtures are executable after a
  source WAV is supplied, except silence/noise which need no source. Other
  pending entries are not represented by audio in this checkout.

fixtures:
  - id: english_librivox_short
    availability: existing_local_candidate
    path: tests/fixtures/sample_short.mp3
    sha256: 7c29b5ef5ed783a8126c972b745a9a55bbeef9a10fbba604b35303b680180911
    duration_seconds: 3.2
    language: en
    source: https://librivox.org/andersens-fairy-tales-by-hc-andersen/
    source_detail: >-
      Existing 3.2-second excerpt from track 1, The Emperor's New Clothes,
      read by Kara Shallenberg. ID3 tags identify the album, reader, and title.
    license: LibriVox says its recordings are public domain in the USA; check local status outside the USA.
    license_url: https://librivox.org/pages/public-domain/
    redistribution: Existing repository fixture; no new copy is added. Confirm exact excerpt/source chain and applicable public-domain status before redistribution.
    annotation:
      text: Pending human transcript verification for this exact excerpt.
      boundaries: Pending; do not score timing against ASR output as ground truth.
    covers:
      - English speech structural smoke
      - punctuation (pending transcript inspection)
    limitations:
      - Short solo narration only; not interview speech or a quality corpus.

  - id: english_ecb_interview_candidate
    availability: existing_local_candidate
    path: tests/fixtures/wer_lagarde.mp3
    sha256: 4d7b3dd253289bc17ad0e46287a7b8a40911f77a9f1259aaccacdbadb87bfabf
    duration_seconds: 877.633401
    language: en
    source: https://www.youtube.com/watch?v=kd7e3OXkajY
    source_detail: >-
      Existing trimmed interview excerpt described in README.md as Christine
      Lagarde and Andrea Enria at the Fifth ECB Forum on Banking Supervision
      2023, published by the European Central Bank under a Creative Commons
      license. The exact YouTube license version and clip offsets are not
      captured in repository metadata.
    license: Pending exact source-page/license-version verification before CI or artifact redistribution.
    redistribution: Existing repository fixture; do not upload until exact terms are recorded.
    reference_path: tests/fixtures/reference.txt
    annotation:
      text: Existing reference is ASR/WER test material; human verification is pending.
      boundaries: Pending human annotation of a fixed manageable subset.
    covers:
      - Longer English interview candidate
      - Multiple speakers and turn changes (pending segment audit)
      - Speech around 30-second boundaries (pending offset selection)
      - Text quality candidate (not ground truth until reviewed)

  - id: synthetic_silence_noise
    availability: executable_generator
    path: generated in an isolated temporary directory by generate_fixtures.py
    sha256: Generated deterministically; record SHA-256 for each emitted WAV in run output.
    duration_seconds: Per output; silence=8, noise composite=8
    language: und
    source: Synthetic PCM generated by the evaluation harness (recipe below).
    license: Original synthetic signal; no third-party recording or voice.
    recipe: >-
      Run `python tests/fixtures/whisper_cpp/generate_fixtures.py OUT_DIR` for
      8 seconds of PCM silence and an 8-second noise-only composite. With a
      mono 16 kHz signed 16-bit PCM WAV and --speech-sha256, also produce speech
      with 500 ms leading/trailing silence, a 3-second internal gap, and a
      29.5-second prefix so the source speech audio spans the 30-second
      boundary. The generator prints each duration and SHA-256. This positions
      speech across the boundary; human listening must confirm whether a word
      itself crosses it. Never describe these as synthetic speech.
    covers:
      - Silence-only empty output
      - Noise-only controlled false-positive check
      - Leading and trailing silence timeline check (with speech component)

